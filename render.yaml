services:
  - type: web
    name: documind-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DATA_DIR
        value: /var/data

      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2

      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b

      - key: RELEVANCE_THRESHOLD
        value: "0.0"

      - key: GROQ_API_KEY
        sync: false

    disk:
      name: documind-storage
      mountPath: /var/data
      sizeGB: 1